<title>LeadOS Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.lang = "en-GB";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: a calendar web app (top bar, sidebar, week grid, add-on rail) with LeadOS in the add-on side panel.
   Phone width: one day column, LeadOS stacked below it. The panel follows add-on card conventions. */
:root {
  --bg: #ffffff;
  --chrome: #f8fafd;
  --ink: #1f1f1f;
  --ink-2: #444746;
  --muted: #5f6368;
  --line: #dde3ea;
  --line-soft: #eef1f5;
  --today: #0b57d0;
  --today-ink: #ffffff;
  --now: #c5221f;
  --ev-blue-bg: #d3e3fd;   --ev-blue-ink: #041e49;   --ev-blue-bar: #0b57d0;
  --ev-sage-bg: #d5ecdc;   --ev-sage-ink: #0f3d1f;   --ev-sage-bar: #188038;
  --ev-grey-bg: #e3e6ea;   --ev-grey-ink: #202124;   --ev-grey-bar: #5f6368;
  --ev-past: 0.62;
  --brand: #3446c8;
  --brand-soft: #e8ebfb;
  --brand-ink: #ffffff;
  --good: #146c2e; --good-bg: #e6f4ea;
  --warn: #8a5a00; --warn-bg: #fdf0d5;
  --bad: #b3261e;  --bad-bg: #fce8e6;
  --t-lead-yourself: #52606d; --t-set-standard: #1f6fbf; --t-develop-people: #1f7a4d; --t-hold-standard: #a15c07; --t-sustain-grow: #7b3fbf;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --hour: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131314; --chrome: #1b1b1c; --ink: #e3e3e3; --ink-2: #c4c7c5; --muted: #a8abaf; --line: #3a3d41; --line-soft: #26282b;
    --today: #a8c7fa; --today-ink: #062e6f; --now: #f28b82;
    --ev-blue-bg: #0e3a7a; --ev-blue-ink: #e8f0fe; --ev-blue-bar: #a8c7fa;
    --ev-sage-bg: #0d4a24; --ev-sage-ink: #e6f4ea; --ev-sage-bar: #81c995;
    --ev-grey-bg: #3c4043; --ev-grey-ink: #f1f3f4; --ev-grey-bar: #9aa0a6;
    --brand: #aab4ff; --brand-soft: #262c52; --brand-ink: #10164a;
    --good: #81c995; --good-bg: #0f2d19; --warn: #fdd663; --warn-bg: #3a2c05; --bad: #f2b8b5; --bad-bg: #3c1412;
    --t-lead-yourself: #b5c3d4; --t-set-standard: #8ab4f8; --t-develop-people: #87d3a9; --t-hold-standard: #f6c177; --t-sustain-grow: #cdb5ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131314; --chrome: #1b1b1c; --ink: #e3e3e3; --ink-2: #c4c7c5; --muted: #a8abaf; --line: #3a3d41; --line-soft: #26282b;
  --today: #a8c7fa; --today-ink: #062e6f; --now: #f28b82;
  --ev-blue-bg: #0e3a7a; --ev-blue-ink: #e8f0fe; --ev-blue-bar: #a8c7fa;
  --ev-sage-bg: #0d4a24; --ev-sage-ink: #e6f4ea; --ev-sage-bar: #81c995;
  --ev-grey-bg: #3c4043; --ev-grey-ink: #f1f3f4; --ev-grey-bar: #9aa0a6;
  --brand: #aab4ff; --brand-soft: #262c52; --brand-ink: #10164a;
  --good: #81c995; --good-bg: #0f2d19; --warn: #fdd663; --warn-bg: #3a2c05; --bad: #f2b8b5; --bad-bg: #3c1412;
  --t-lead-yourself: #b5c3d4; --t-set-standard: #8ab4f8; --t-develop-people: #87d3a9; --t-hold-standard: #f6c177; --t-sustain-grow: #cdb5ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---- demo bar (outside the calendar) ---- */
.demo-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between;
  padding: 8px 16px; background: var(--brand); color: var(--brand-ink); font-size: 13px;
}
.demo-bar .tag { font-weight: 500; }
.demo-bar .tag span { opacity: .9; font-weight: 400; }
.demo-bar .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { border: 1px solid color-mix(in srgb, var(--brand-ink) 45%, transparent); background: transparent; color: var(--brand-ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.pill[aria-pressed="true"] { background: var(--brand-ink); color: var(--brand); font-weight: 500; }

/* ---- calendar chrome ---- */
.cal { display: flex; flex-direction: column; height: calc(100% - 46px); min-height: 560px; background: var(--chrome); }
.gc-top { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 60px; }
.gc-top .menu { border: 0; background: none; border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink-2); }
.gc-logo { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--ink-2); margin-right: 24px; }
.gc-logo .mark { width: 32px; height: 32px; border-radius: 6px; border: 2px solid var(--ink-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; position: relative; }
.gc-logo .mark::before { content: ""; position: absolute; top: 5px; left: 3px; right: 3px; height: 2px; background: var(--ink-2); }
.btn-outline { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 18px; font-weight: 500; }
.nav-arrows { display: flex; gap: 2px; }
.nav-arrows button { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.gc-title { font-size: 22px; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-top .right { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #7b5ea7; color: #fff; display: grid; place-items: center; font-weight: 500; font-size: 13px; }

.gc-body { flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr) auto 56px; min-height: 0; }
.gc-side { padding: 8px 12px 16px 16px; overflow: auto; }
.create { display: flex; align-items: center; gap: 12px; border: 0; background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.18); border-radius: 16px; padding: 16px 20px 16px 16px; font-weight: 500; margin-bottom: 18px; }
.mini { font-size: 12px; color: var(--ink-2); }
.mini .head { display: flex; justify-content: space-between; padding: 0 4px 6px; font-weight: 500; }
.mini table { width: 100%; border-collapse: collapse; text-align: center; }
.mini th { font-weight: 500; color: var(--muted); padding: 4px 0; }
.mini td { padding: 3px 0; }
.mini td span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; }
.mini td.other { color: var(--muted); }
.mini td.today span { background: var(--today); color: var(--today-ink); font-weight: 500; }
.cals { margin-top: 20px; font-size: 13px; }
.cals h2 { font-size: 13px; font-weight: 500; margin: 0 0 6px; }
.cals label { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.cals .sw { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }

.gc-main { background: var(--bg); border-radius: 16px 16px 0 0; display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; }
.week-head { display: grid; grid-template-columns: 56px repeat(var(--days), minmax(0, 1fr)); border-bottom: 1px solid var(--line); padding-top: 10px; }
.week-head .tz { font-size: 10px; color: var(--muted); align-self: end; padding: 0 0 6px 8px; }
.dayname { text-align: center; padding-bottom: 8px; }
.dayname .dow { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.dayname .num { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; color: var(--ink-2); margin-top: 2px; }
.dayname.is-today .dow { color: var(--today); }
.dayname.is-today .num { background: var(--today); color: var(--today-ink); }
.grid-scroll { flex: 1; overflow-y: auto; min-height: 0; position: relative; }
.grid { display: grid; grid-template-columns: 56px repeat(var(--days), minmax(0, 1fr)); position: relative; }
.hours { position: relative; }
.hours div { height: var(--hour); font-size: 10px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-7px); }
.day-col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line-soft) 1px, transparent 1px); background-size: 100% var(--hour); }
.cal-event {
  position: absolute; border: 0; text-align: left; padding: 3px 6px 3px 8px; border-radius: 6px; overflow: hidden;
  font-size: 12px; line-height: 1.25; display: flex; flex-direction: column; gap: 1px; box-shadow: inset 3px 0 0 var(--bar);
  background: var(--bgc); color: var(--fg);
}
.cal-event .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event.short { flex-direction: row; gap: 6px; align-items: center; padding-block: 1px; }
.cal-event.past { --bgc: color-mix(in srgb, var(--ev) var(--past-mix, 55%), var(--bg)); }
.cal-event.selected { box-shadow: inset 3px 0 0 var(--bar), 0 0 0 2px var(--today), 0 4px 10px rgba(0,0,0,.2); z-index: 3; }
.ev-blue { --ev: var(--ev-blue-bg); --bgc: var(--ev-blue-bg); --fg: var(--ev-blue-ink); --bar: var(--ev-blue-bar); }
.ev-sage { --ev: var(--ev-sage-bg); --bgc: var(--ev-sage-bg); --fg: var(--ev-sage-ink); --bar: var(--ev-sage-bar); }
.ev-grey { --ev: var(--ev-grey-bg); --bgc: var(--ev-grey-bg); --fg: var(--ev-grey-ink); --bar: var(--ev-grey-bar); }
.now-line { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -6px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--now); }

/* event details popover (the calendar's own) */
.popover {
  position: absolute; z-index: 10; width: min(360px, calc(100% - 24px)); background: var(--bg); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 8px 8px 16px 20px;
}
.popover .tools { display: flex; justify-content: flex-end; }
.popover .tools button { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.popover h2 { font-size: 20px; font-weight: 400; margin: 0 12px 2px 0; display: flex; gap: 12px; align-items: flex-start; }
.popover h2::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--bar); margin-top: 7px; flex: none; }
.popover p { margin: 0 0 6px 26px; color: var(--ink-2); }
.popover .addon-hint { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* add-on rail */
.gc-rail { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; border-left: 1px solid var(--line); }
.rail-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); position: relative; }
.rail-btn.on { background: var(--brand-soft); color: var(--brand); }
.rail-sep { width: 20px; height: 1px; background: var(--line); }

/* ---- the LeadOS add-on panel (card conventions: one accent, quiet type) ---- */
.addon { width: 340px; background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.addon-head { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; min-height: 52px; }
.addon-head .back { border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); margin-left: -6px; }
.addon-head .name { font-size: 16px; font-weight: 500; flex: 1; }
.addon-head .quiet { border: 0; background: none; color: var(--brand); font-size: 13px; font-weight: 500; padding: 6px 8px; border-radius: 6px; }
.logo { width: 22px; height: 22px; flex: none; }
.addon-body { flex: 1; overflow-y: auto; padding: 0 0 24px; scroll-behavior: smooth; }
.card-head { padding: 8px 20px 4px; }
.card-head h2 { font-size: 20px; font-weight: 400; margin: 0; line-height: 1.3; }
.meta { color: var(--muted); font-size: 12px; }
.section { padding: 16px 20px; display: grid; gap: 12px; }
.section + .section { border-top: 1px solid var(--line-soft); }
.section h3 { font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 0; }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--tier); display: inline-block; flex: none; }
.pillar-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.moments { display: grid; gap: 2px; margin: 0 -10px; }
.mrow { border: 0; background: none; text-align: left; border-radius: 8px; padding: 9px 10px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.mrow:hover { background: var(--line-soft); }
.mrow .time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mrow .title { font-size: 14px; line-height: 1.35; }
.mrow .pillar-tag { grid-column: 2; }
.mrow .st { grid-column: 3; grid-row: 1; font-size: 12px; white-space: nowrap; }
.st-now { color: var(--brand); font-weight: 700; }
.st-next { color: var(--ink-2); }
.st-ask { color: var(--brand); }
.tick { display: inline-grid; place-items: center; width: 18px; height: 18px; color: var(--brand); }
.tick svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.link { border: 0; background: none; color: var(--brand); font-weight: 500; padding: 0; text-align: left; justify-self: start; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 6px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--brand); border-radius: 999px; padding: 8px 16px; font-weight: 500; font-size: 13px; justify-self: start; }
.btn.filled { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.focus-line { margin: 0; }
.qs { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.context { border-left: 2px solid var(--line); padding-left: 10px; color: var(--ink-2); font-size: 13px; }
.context q { font-style: italic; }
.quiet-note { margin: 0; color: var(--muted); font-size: 13px; }
.saved { color: var(--brand); font-weight: 500; font-size: 13px; }
.thinking { color: var(--muted); animation: pulse 1.2s ease-in-out infinite; margin: 0; }
@keyframes pulse { 50% { opacity: .5; } }
.err { color: var(--ink-2); font-size: 13px; margin: 0; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats b { display: block; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); }
.scale { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.scale .nm { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dots { display: flex; gap: 4px; }
.dots label { position: relative; }
.dots input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.dots span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums; }
.dots input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.dots input:focus-visible + span { outline: 2px solid var(--today); outline-offset: 2px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "\203A"; display: inline-block; width: 12px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
.week-list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.week-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.week-list .d { color: var(--muted); font-size: 12px; }
.week-list em { grid-column: 2; color: var(--muted); font-size: 12px; }
.prow { border-left: 2px solid var(--tier); padding: 2px 0 2px 12px; display: grid; gap: 4px; scroll-margin-top: 8px; }
.prow .pname { font-size: 15px; }
.prow .pline { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
.prow .pline > span { min-width: 0; flex: 1; }
.prow .pline .spark { flex: none; }
.prow ul { margin: 6px 0 0; padding-left: 16px; font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; }
.spark { display: block; }
.spark line { stroke: var(--tier); stroke-width: 1.5; stroke-linecap: round; }
.spark line.gap { stroke-dasharray: 2 3; opacity: .7; }
.spark circle { fill: var(--tier); }
.reads { padding: 4px 20px 0; }
.reads p { margin: 6px 0 0; font-size: 12px; color: var(--ink-2); }
.t-lead-yourself { --tier: var(--t-lead-yourself); } .t-set-standard { --tier: var(--t-set-standard); }
.t-develop-people { --tier: var(--t-develop-people); } .t-hold-standard { --tier: var(--t-hold-standard); }
.t-sustain-grow { --tier: var(--t-sustain-grow); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* ---- demo script ---- */
.script {
  position: fixed; right: 16px; top: 54px; z-index: 30; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 72px); overflow: auto;
  background: var(--bg); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.3); padding: 16px;
}
.script h2 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
.script > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.script ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; counter-reset: s; }
.script li { counter-increment: s; }
.script li button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px 10px 42px; position: relative; }
.script li button::before { content: counter(s); position: absolute; left: 12px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.script li b { display: block; font-weight: 500; }
.script li span { color: var(--muted); font-size: 12px; }
.script .close { position: absolute; right: 8px; top: 8px; border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; color: var(--ink-2); display: grid; place-items: center; }

/* ---- HR dashboard ---- */
.hr { max-width: 1080px; margin: 0 auto; padding: 24px 16px 56px; display: grid; gap: 18px; }
.hr h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 500; margin: 4px 0 0; }
.hr .kicker { font-size: 12px; font-weight: 500; color: var(--brand); letter-spacing: .06em; text-transform: uppercase; }
.banner { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); }
.kpi .target { color: var(--good); font-size: 12px; font-weight: 500; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.panel h2 { font-size: 16px; font-weight: 500; margin: 0; }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
.chart-wrap { overflow-x: auto; }
.chart text { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  <h2>Demo script · 5 minutes</h2>

<script src="logic.js"></script>
<script src="scenario.js"></script>
<script>
(() => {
  const L = window.LeadOSLogic;
  const SC = window.LeadOSScenario;
  const { TIERS, TIER, SYS, TYPES, RATING, NEXT, WEEKDAYS, esc } = L;
  const { NOW, TODAY_IDX, ORG, EVENTS, SEED_CAPTURES, BASE_USES, SELF_HISTORY, LAST_TRY, HR_WEEKS, PILOT_WEEK, LOOKBACK_AT, COHORT_RATINGS } = SC;
  const H0 = 8, H1 = 18;

  // ------------------------------------------------------------ dates: the Friday of the current week
  const real = new Date();
  const monday = new Date(real.getFullYear(), real.getMonth(), real.getDate() - ((real.getDay() + 6) % 7));
  const dayDate = (i) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
  const fmt = (d, o) => d.toLocaleDateString('en-GB', o);
  const FRIDAY = dayDate(TODAY_IDX);
  const byId = Object.fromEntries(EVENTS.map((e) => [e.id, e]));
  const todays = EVENTS.filter((e) => e.day === TODAY_IDX);

  // ------------------------------------------------------------ state (per-viewer convenience only)
  const KEY = 'leados-calendar-demo-v2';
  const fresh = () => ({ view: 'manager', stack: [{ card: 'home' }], selected: null, captures: structuredClone(SEED_CAPTURES), energy: null, noteOpen: {}, lookback: { scores: {}, win: '', tryNext: '', saved: false } });
  let S = fresh();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.captures) S = { ...fresh(), ...saved, stack: [{ card: 'home' }], selected: null };
  } catch {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ captures: S.captures, energy: S.energy, lookback: S.lookback, view: S.view })); } catch {} };
  const ai = {}; let aiReflect = null; let sample = null; let aiBlocked = false;

  const $ = (s, r = document) => r.querySelector(s);
  const isPhone = () => matchMedia('(max-width: 760px)').matches;
  const top = () => S.stack.at(-1);
  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };

  function summary() {
    const weekItems = EVENTS.filter((e) => e.day < TODAY_IDX && e.type).map((e) => ({ ...e, ...(S.captures[e.id] ?? {}) }));
    return L.weekSummary(weekItems, todays, S.captures, NOW);
  }
  const extras = () => ({ energy: S.energy, lookbackSaved: S.lookback.saved });
  const uses = () => L.systemUses(BASE_USES, summary(), extras());
  const pillarTag = (type) => { const t = L.pillarOf(type); return `<span class="pillar-tag t-${t.id}" data-testid="pillar-tag"><span class="pdot" aria-hidden="true"></span>${esc(t.name)}</span>`; };
  const TICK = '<span class="tick" role="img" aria-label="Captured"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>';

  // ------------------------------------------------------------ Claude (optional; hidden when unavailable)
  if (window.claude?.use) window.claude.use('sample').then((s) => { sample = s; renderPanel(); }).catch(() => {});
  const HIDE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  const aiCopy = (c) => ({ rate_limited: 'Claude is busy. Try again in a minute.', refused: 'Claude declined this one. The questions above still work.', session_expired: 'Sign in to Claude again to use this.' })[c] || 'Couldn\u2019t get questions from Claude. Try again.';
  const orgBlock = () => `Organisation: ${ORG.name}, UK, about 850 people.\nValues: ${ORG.values.join('; ')}.\nManager standards:\n- ${ORG.standards.join('\n- ')}\nLeadership framework (LeadOS: five pillars, each enabling the next, with two systems each): ${TIERS.map((t) => `${t.name} (${t.systems.map((s) => `${s.code} ${s.name}`).join(', ')})`).join('; ')}.`;

  async function askPrep(e) {
    ai[e.id] = { loading: true }; renderPanel();
    const prompt = L.prepPrompt(e, { orgBlock: orgBlock(), depth: L.promptDepth(TYPES[e.type].sys, uses()) });
    try {
      const out = await sample.json(prompt, { modelTier: 'quick', cache: false });
      const qs = Array.isArray(out?.questions) ? out.questions.map(String).filter((q) => q.trim()).slice(0, 3) : [];
      if (!out?.focus || qs.length < 2) throw { code: 'invalid_json' };
      ai[e.id] = { focus: String(out.focus), questions: qs };
    } catch (err) {
      if (HIDE.includes(err?.code)) { aiBlocked = true; delete ai[e.id]; } else ai[e.id] = { error: aiCopy(err?.code) };
    }
    renderPanel();
  }
  async function askReflect() {
    aiReflect = { loading: true }; renderPanel();
    const s = summary();
    const lines = s.captured.map((c) => `- ${WEEKDAYS[c.day]} ${c.title}: ${RATING[c.rating]}${c.next ? `, next: ${NEXT[c.next]}` : ''}${c.note ? `, note: "${c.note}"` : ''}`).join('\n');
    const prompt = `You help a frontline manager reflect on their week in LeadOS. Ask questions only; never give advice, conclusions or a plan. The manager does the thinking.\n\n${orgBlock()}\n\nTheir captured moments this week:\n${lines}\nLast week they said they'd try: "${LAST_TRY}".\n\nSpot up to three patterns across the week and turn each into one reflective question under 30 words that names the specific moments. British English. No emoji.\nReply with only JSON: {"questions": ["...", "..."]}`;
    try {
      const out = await sample.json(prompt, { modelTier: 'quick', cache: false });
      const qs = Array.isArray(out?.questions) ? out.questions.map(String).filter(Boolean).slice(0, 3) : [];
      if (!qs.length) throw { code: 'invalid_json' };
      aiReflect = { questions: qs };
    } catch (err) {
      if (HIDE.includes(err?.code)) { aiBlocked = true; aiReflect = null; } else aiReflect = { error: aiCopy(err?.code) };
    }
    renderPanel();
  }

  // ------------------------------------------------------------ calendar grid
  function renderChrome() {
    $('#gc-title').textContent = fmt(FRIDAY, { month: 'long', year: 'numeric' });
    $('#logo-day').textContent = FRIDAY.getDate();
    const first = new Date(FRIDAY.getFullYear(), FRIDAY.getMonth(), 1);
    const start = new Date(first.getFullYear(), first.getMonth(), 1 - ((first.getDay() + 6) % 7));
    let rows = '';
    for (let w = 0; w < 6; w++) {
      rows += '<tr>';
      for (let d = 0; d < 7; d++) {
        const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d);
        const cls = day.toDateString() === FRIDAY.toDateString() ? 'today' : day.getMonth() !== FRIDAY.getMonth() ? 'other' : '';
        rows += `<td class="${cls}"><span>${day.getDate()}</span></td>`;
      }
      rows += '</tr>';
    }
    $('#mini').innerHTML = `<div class="head"><span>${fmt(FRIDAY, { month: 'long', year: 'numeric' })}</span></div>
      <table aria-label="Mini month"><thead><tr>${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d) => `<th scope="col">${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  }

  /** Greedy side-by-side columns for overlapping events within one day. */
  function layoutDay(events) {
    const sorted = [...events].sort((a, b) => toMin(a.start) - toMin(b.start));
    const cols = [];
    for (const e of sorted) {
      let c = cols.findIndex((end) => end <= toMin(e.start));
      if (c === -1) { c = cols.length; cols.push(0); }
      cols[c] = toMin(e.end);
      e._col = c;
    }
    for (const e of sorted) e._cols = sorted.filter((o) => toMin(o.start) < toMin(e.end) && toMin(o.end) > toMin(e.start)).reduce((m, o) => Math.max(m, o._col + 1), 1);
    return sorted;
  }

  function renderGrid() {
    const days = isPhone() ? [TODAY_IDX] : [0, 1, 2, 3, 4];
    const hourPx = 48;
    document.documentElement.style.setProperty('--days', days.length);
    $('#week-head').style.setProperty('--days', days.length);
    $('#grid').style.setProperty('--days', days.length);
    $('#week-head').innerHTML = `<div class="tz">GMT+01</div>` + days.map((d) => {
      const dt = dayDate(d);
      return `<div class="dayname ${d === TODAY_IDX ? 'is-today' : ''}"><div class="dow">${fmt(dt, { weekday: 'short' })}</div><div class="num" ${d === TODAY_IDX ? 'aria-current="date"' : ''}>${dt.getDate()}</div></div>`;
    }).join('');
    const hours = Array.from({ length: H1 - H0 }, (_, i) => `<div>${i === 0 ? '' : `${String(H0 + i).padStart(2, '0')}:00`}</div>`).join('');
    const cols = days.map((d) => {
      const evs = layoutDay(EVENTS.filter((e) => e.day === d));
      const blocks = evs.map((e) => {
        const top = ((toMin(e.start) - H0 * 60) / 60) * hourPx;
        const h = Math.max(((toMin(e.end) - toMin(e.start)) / 60) * hourPx - 2, 18);
        const w = 100 / e._cols;
        const past = d < TODAY_IDX || e.end <= NOW;
        return `<button type="button" class="cal-event ev-${e.colour} ${past ? 'past' : ''} ${h < 34 ? 'short' : ''} ${S.selected === e.id ? 'selected' : ''}" data-testid="cal-event" data-event="${e.id}"
          style="top:${top}px;height:${h}px;left:calc(${e._col * w}% + 2px);width:calc(${w}% - 6px)"
          aria-label="${esc(e.title)}, ${fmt(dayDate(d), { weekday: 'long' })} ${e.start} to ${e.end}">
          <span class="t">${esc(e.title)}</span><span class="w">${e.start} – ${e.end}</span></button>`;
      }).join('');
      const nowTop = ((toMin(NOW) - H0 * 60) / 60) * hourPx;
      return `<div class="day-col" data-testid="day-col" style="height:${(H1 - H0) * hourPx}px">${blocks}${d === TODAY_IDX ? `<div class="now-line" data-testid="now-line" style="top:${nowTop}px" aria-hidden="true"></div>` : ''}</div>`;
    }).join('');
    $('#grid').innerHTML = `<div class="hours" aria-hidden="true">${hours}</div>${cols}`;
  }

  function renderPopover() {
    const host = $('#popover-host');
    const e = S.selected && byId[S.selected];
    if (!e) { host.innerHTML = ''; return; }
    const btn = $(`[data-event="${e.id}"]`);
    const main = $('.gc-main').getBoundingClientRect();
    const r = btn?.getBoundingClientRect();
    let left = 12, topPx = 80;
    if (r) {
      const width = Math.min(360, main.width - 24);
      left = r.right - main.left + 8;
      if (left + width > main.width - 12) left = r.left - main.left - width - 8;
      left = Math.max(12, Math.min(left, main.width - width - 12));
      topPx = Math.max(8, Math.min(r.top - main.top, main.height - 220));
    }
    host.innerHTML = `<div class="popover ev-${e.colour}" role="dialog" aria-labelledby="pop-title" style="left:${left}px;top:${topPx}px">
      <div class="tools"><button type="button" aria-label="Close" data-close-pop><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <h2 id="pop-title">${esc(e.title)}</h2>
      <p>${fmt(dayDate(e.day), { weekday: 'long', day: 'numeric', month: 'long' })} · ${e.start} – ${e.end}</p>
      <p>${e.n > 1 ? `${e.n} guests` : 'Just you'}</p>
      <p class="addon-hint"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px"><rect x="8" y="3" width="8" height="4" rx="1.2" fill="var(--brand)" opacity=".45"/><rect x="6" y="8.5" width="12" height="4" rx="1.2" fill="var(--brand)" opacity=".6"/><rect x="4" y="14" width="16" height="4" rx="1.2" fill="var(--brand)" opacity=".8"/><rect x="2" y="19.5" width="20" height="2.5" rx="1" fill="var(--brand)"/></svg>LeadOS is showing this event in the side panel</p>
    </div>`;
  }

  // ------------------------------------------------------------ the LeadOS add-on panel
  function homeCard() {
    const moments = todays.filter((e) => e.type);
    const rows = moments.map((e) => {
      const st = L.rowStatus(e, todays, S.captures, NOW);
      const label = st === 'captured' ? TICK : st === 'now' ? '<span class="st-now">Now</span>' : st === 'next' ? '<span class="st-next">Up next</span>' : st === 'ask' ? '<span class="st-ask">How did it go?</span>' : '';
      return `<button type="button" class="mrow t-${L.pillarOf(e.type).id}" data-testid="moment-row" data-pillar="${L.pillarOf(e.type).id}" data-open="${e.id}">
        <span class="time">${e.start}</span><span class="title">${esc(e.title)}</span><span class="st">${label}</span>${pillarTag(e.type)}</button>`;
    }).join('');
    return `<div class="card-head"><h2>Today</h2><div class="meta">${fmt(FRIDAY, { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
      <div class="section" id="energy"><h3>How\u2019s your energy going into today?</h3>
        <div class="seg" role="group" aria-label="Energy">${['Low', 'Steady', 'High'].map((v) => `<button type="button" data-energy="${v}" aria-pressed="${S.energy === v}">${v}</button>`).join('')}</div>
        ${S.energy === 'Low' ? '<div class="context">Low energy, with a hard conversation at 12:00. What could you move or drop this afternoon?</div>' : ''}</div>
      <div class="section"><div class="moments">${rows}</div></div>
      <div class="section"><button type="button" class="link" data-push="lookback">Friday look-back</button></div>
      <details class="reads"><summary>What LeadOS reads</summary><p>Only each event\u2019s title, time and attendee count. Never descriptions, notes, attachments or who is invited. LeadOS never writes to your calendar.</p></details>`;
  }

  function prepSection(e) {
    const a = ai[e.id];
    const card = a?.questions ? { ...a, meta: null } : e.prep && L.prepCard(e.prep, L.promptDepth(TYPES[e.type].sys, uses()));
    return `<div class="section" id="prep"><h3>Before</h3>
      ${e.context ? `<div class="context">${e.context}</div>` : ''}
      ${a?.loading ? '<p class="thinking">Claude is writing questions for this moment\u2026</p>' : card ? `<p class="focus-line">${esc(card.focus)}</p>${card.meta ? `<p class="meta" style="margin:-6px 0 0">${esc(card.meta)}</p>` : ''}<ol class="qs">${card.questions.map((q) => `<li data-testid="prep-question">${esc(q)}</li>`).join('')}</ol>` : ''}
      ${a?.error ? `<p class="err">${esc(a.error)}</p>` : ''}
      ${sample && !aiBlocked && !a?.loading ? `<button type="button" class="link" data-ask="${e.id}">${a?.questions ? 'Ask Claude again' : 'Fresh questions from Claude'}</button>` : ''}
    </div>`;
  }

  function captureSection(e) {
    const st = e.day < TODAY_IDX ? 'past' : L.momentStatus(e, NOW);
    if (st === 'later') return `<div class="section"><p class="quiet-note">After ${e.end}, you can note how it went.</p></div>`;
    const c = S.captures[e.id] ?? {};
    const seg = (field, map, label) => `<div class="seg" role="group" aria-label="${label}">${Object.entries(map).map(([v, t]) =>
      `<button type="button" data-cap="${e.id}" data-f="${field}" data-v="${v}" aria-pressed="${c[field] === v}">${t}</button>`).join('')}</div>`;
    const open = S.noteOpen[e.id] || c.note;
    return `<div class="section" id="capture"><h3>How did it go? ${L.isCaptured(c) ? TICK : ''}</h3>
      ${seg('rating', RATING, 'How did it go')}
      ${L.needsNextStep(c.rating) ? `<h3>What next?</h3>${seg('next', NEXT, 'What next')}` : ''}
      ${open ? `<label class="field">Note, only you see it<textarea id="note-${e.id}" data-note="${e.id}" rows="2" maxlength="300">${esc(c.note)}</textarea></label>`
        : `<button type="button" class="link" data-opennote="${e.id}">Add a note</button>`}
    </div>`;
  }

  function eventCard(e) {
    const when = `${fmt(dayDate(e.day), { weekday: 'long' })} \u00b7 ${e.start} \u2013 ${e.end}`;
    if (!e.type) {
      return `<div class="card-head"><h2>${esc(e.title)}</h2><div class="meta">${when}</div></div>
        <div class="section"><div>Not a leadership moment</div><p class="quiet-note">LeadOS looks for moments where how you lead matters. It decided from this event\u2019s title, time and attendee count, and nothing else.</p></div>`;
    }
    return `<div class="card-head"><h2>${esc(e.title)}</h2><div class="meta">${when}</div><div style="margin-top:6px">${pillarTag(e.type)}</div></div>
      ${e.prep ? prepSection(e) : ''}
      ${captureSection(e)}`;
  }

  function lookbackCard() {
    const s = summary();
    const qs = L.reflectionQuestions(s, LAST_TRY);
    const lb = S.lookback;
    const list = s.captured.map((m) => `<li><span class="d">${WEEKDAYS[m.day].slice(0, 3)}</span><span>${esc(m.title)} \u00b7 ${RATING[m.rating]}</span>${m.note ? `<em>${esc(m.note)}</em>` : ''}</li>`).join('');
    return `<div class="card-head"><h2>Friday look-back</h2><div class="meta">Week of ${fmt(monday, { day: 'numeric', month: 'long' })}</div></div>
      <div class="section"><div class="stats"><div><b>${s.moments.length}</b><span>moments</span></div><div><b>${s.well.length}</b><span>went well</span></div><div><b>${s.hard.length}</b><span>felt hard</span></div><div><b>${s.open.length}</b><span>to come back to</span></div></div></div>
      <div class="section" id="reflect"><h3>Think about</h3><ol class="qs">${qs.map((q) => `<li data-testid="reflect-question">${esc(q)}</li>`).join('')}</ol>
        ${aiReflect?.loading ? '<p class="thinking">Claude is reading your week\u2026</p>' : ''}
        ${aiReflect?.questions ? `<h3>Claude noticed</h3><ol class="qs">${aiReflect.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ol>` : ''}
        ${aiReflect?.error ? `<p class="err">${esc(aiReflect.error)}</p>` : ''}
        ${sample && !aiBlocked && !aiReflect?.loading ? `<button type="button" class="link" data-reflect>${aiReflect?.questions ? 'Ask Claude again' : 'What patterns does Claude notice?'}</button>` : ''}</div>
      <form class="section" id="lookback-form"><h3>How did you do? 1 struggled, 5 strong</h3>
        ${[...TIERS].reverse().map((t) => `<div class="scale t-${t.id}"><div class="nm"><span class="pdot" aria-hidden="true"></span><span id="lbl-${t.id}">${esc(t.name)}</span></div>
          <div class="dots" role="radiogroup" aria-labelledby="lbl-${t.id}">${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" id="r-${t.id}-${n}" name="${t.id}" value="${n}" aria-label="${n}" ${lb.scores[t.id] === n ? 'checked' : ''}><span aria-hidden="true">${n}</span></label>`).join('')}</div></div>`).join('')}
        <label class="field">One win from this week<textarea id="lb-win" rows="2" maxlength="300">${esc(lb.win)}</textarea></label>
        <label class="field">One thing to try next week<textarea id="lb-try" rows="2" maxlength="300">${esc(lb.tryNext)}</textarea></label>
        <div style="display:flex;gap:12px;align-items:center"><button type="submit" class="btn filled">Save look-back</button>${lb.saved ? '<span class="saved" role="status">Look-back saved</span>' : ''}</div>
      </form>
      <div class="section"><details><summary>This week\u2019s moments</summary><ul class="week-list">${list}</ul></details></div>`;
  }

  /** A small trend line, 1-5 scale. Missing weeks are bridged with a dashed segment (L.sparkSegments). */
  function sparkline(values, w = 72, h = 22, label = '') {
    const n = values.length;
    const at = (i) => [3 + (i * (w - 6)) / (n - 1), h - 3 - ((values[i] - 1) / 4) * (h - 6)];
    const { points, solid, dashed } = L.sparkSegments(values);
    const seg = ([i, j], cls) => { const [x1, y1] = at(i), [x2, y2] = at(j); return `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; };
    const last = points.at(-1);
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${solid.map((x) => seg(x, 'solid')).join('')}${dashed.map((x) => seg(x, 'gap')).join('')}${points.map((i) => `<circle cx="${at(i)[0]}" cy="${at(i)[1]}" r="${i === last ? 2.6 : 1.6}"/>`).join('')}</svg>`;
  }

  function pillarsCard() {
    const counts = L.pillarWeekCounts(summary(), extras());
    const sysCounts = L.systemWeekCounts(summary(), extras());
    return `<div class="card-head"><h2>Your pillars</h2><div class="meta">Each level enables the next.</div></div>
      <div class="section">${[...TIERS].reverse().map((t) => {
        const ratings = [...SELF_HISTORY[t.id], S.lookback.saved ? S.lookback.scores[t.id] ?? null : null];
        const latest = ratings.filter((r) => r != null).at(-1);
        return `<div class="prow t-${t.id}" id="pillar-${t.id}" data-testid="pillar-row">
          <div class="pname">${esc(t.name)}</div>
          <div class="pline"><span data-testid="pillar-line">${(() => {
            const line = L.pillarCountLine(counts[t.id], L.pillarNextUp(t.id, todays, NOW, { lookbackAt: LOOKBACK_AT, lookbackSaved: S.lookback.saved }));
            const head = line && counts[t.id] > 0 ? `<span data-testid="pillar-count">${line}</span>` : esc(line);
            return [head, latest ? `you said ${latest}/5` : ''].filter(Boolean).join(' \u00b7 ');
          })()}</span>${sparkline(ratings)}</div>
          <details><summary>What\u2019s underneath</summary><ul>${t.systems.map((x) => `<li>${esc(x.name)} <span class="meta" data-testid="system-count">\u00b7 ${sysCounts[x.code]}</span></li>`).join('')}</ul></details>
        </div>`;
      }).join('')}</div>`;
  }

  let lastCardKey = '';
  function renderPanel() {
    const t = top();
    $('#addon-head').innerHTML = `${S.stack.length > 1 ? `<button class="back" type="button" aria-label="Back" data-back><svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>` : ''}
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.2" fill="var(--brand)" opacity=".45"/><rect x="6" y="8.5" width="12" height="4" rx="1.2" fill="var(--brand)" opacity=".6"/><rect x="4" y="14" width="16" height="4" rx="1.2" fill="var(--brand)" opacity=".8"/><rect x="2" y="19.5" width="20" height="2.5" rx="1" fill="var(--brand)"/></svg>
      <span class="name">LeadOS</span>
      ${t.card === 'pillars' ? '' : '<button class="quiet" type="button" data-push="pillars">Your pillars</button>'}`;
    const body = $('#addon-body');
    const key = JSON.stringify(t);
    const keep = key === lastCardKey ? body.scrollTop : 0;
    const focusId = document.activeElement?.id;
    const openDetails = [...body.querySelectorAll('details[open]')].map((d) => d.closest('[id]')?.id);
    body.innerHTML = t.card === 'home' ? homeCard() : t.card === 'event' ? eventCard(byId[t.id]) : t.card === 'lookback' ? lookbackCard() : pillarsCard();
    if (key === lastCardKey) openDetails.forEach((id) => id && body.querySelector(`#${CSS.escape(id)} details`)?.setAttribute('open', ''));
    body.scrollTop = keep;
    lastCardKey = key;
    if (focusId && document.getElementById(focusId) && body.contains(document.getElementById(focusId))) document.getElementById(focusId).focus({ preventScroll: true });
    persist();
  }

  function renderView() {
    $('#cal').hidden = S.view !== 'manager';
    $('#hr').hidden = S.view !== 'hr';
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
    if (S.view === 'hr') $('#hr').innerHTML = hrView();
    persist();
  }

  function renderAll() { renderChrome(); renderGrid(); renderPopover(); renderPanel(); renderView(); }

  // ------------------------------------------------------------ HR dashboard (aggregates only)
  function cohortPanels() {
    const extra = S.lookback.saved ? { week: PILOT_WEEK, scores: S.lookback.scores } : null;
    const cohort = L.cohortSelfRatings(COHORT_RATINGS, { minRaters: 5, extra });
    const rows = [...TIERS].reverse().map((t) => {
      const pts = cohort[t.id];
      const latest = pts.filter((p) => p.avg != null).at(-1);
      return `<div class="cohort-row t-${t.id}" data-testid="cohort-line"><span>${esc(t.name)}</span>
        ${sparkline(pts.map((p) => p.avg), 160, 30, `${t.name}: average self-rating by pilot week`)}
        <span class="v">${latest ? latest.avg.toFixed(1) : '–'}</span></div>`;
    }).join('');
    return `<div class="two">
      <section class="panel" aria-labelledby="h-said"><h2 id="h-said">How managers rate themselves</h2>
        <div class="kicker" style="font-size:11px">Manager-said · average self-rating, 1 to 5, pilot weeks 1–${PILOT_WEEK}</div>
        ${rows}
        <p class="foot">Weeks where fewer than 5 managers rated a pillar are hidden; dashed lines bridge them.</p>
      </section>
      <section class="panel muted-panel" aria-labelledby="h-saw"><h2 id="h-saw">Team-saw</h2>
        <p>Team-saw: coming next. Short pulse from each manager’s team, compared pillar by pillar.</p>
      </section>
    </div>`;
  }

  function hrView() {
    const s = summary();
    const cur = L.hrSnapshot(HR_WEEKS, s.captured.length);
    const weeks = [...HR_WEEKS.slice(0, -1), cur];
    const total = 24, target = 0.6;
    const pct = (x) => `${Math.round(x * 100)}%`;
    const mix = { 'develop-people': 0.38, 'set-standard': 0.21, 'hold-standard': 0.14, 'lead-yourself': 0.17, 'sustain-grow': 0.10 };
    const W = 560, H = 200, P = { l: 30, r: 54, t: 12, b: 26 };
    const bw = (W - P.l - P.r) / weeks.length;
    const y = (v) => P.t + (H - P.t - P.b) * (1 - v / total);
    const bars = weeks.map((d, i) => {
      const x = P.l + i * bw + bw * 0.2, w = bw * 0.6;
      return `<rect x="${x}" y="${y(d.active)}" width="${w}" height="${y(0) - y(d.active)}" rx="3" fill="var(--line)"><title>${d.active} active</title></rect>
        <rect x="${x}" y="${y(d.three)}" width="${w}" height="${y(0) - y(d.three)}" rx="3" fill="var(--brand)"><title>${d.three} at 3 or more moments</title></rect>
        <text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d.w}</text>`;
    }).join('');
    return `<div><div class="kicker">HR dashboard · Head of L&amp;D</div><h1>Manager pilot</h1><div class="meta" style="font-size:14px">Pilot week ${PILOT_WEEK} of 12</div></div>
      <div class="banner">A mocked cohort of 23 managers plus the demo manager’s live clicks. Aggregates only: no individual manager, meeting title, rating or note is ever shown here.</div>
      <div class="kpis">
        <div class="kpi"><b>${cur.active}/${total}</b><span>managers active this week</span></div>
        <div class="kpi"><b>${pct(cur.three / total)}</b><span>used LeadOS at 3 or more moments</span><span class="target">Pilot target ${pct(target)}</span></div>
        <div class="kpi"><b>4.6</b><span>moments per active manager</span></div>
        <div class="kpi"><b>${S.lookback.saved ? '58%' : '54%'}</b><span>did a Friday look-back</span></div>
      </div>
      <div class="two">
        <section class="panel" aria-labelledby="h-usage"><h2 id="h-usage">Weekly usage</h2>
          <div class="legend"><span><i style="background:var(--line)"></i>Active managers</span><span><i style="background:var(--brand)"></i>At 3 or more moments</span></div>
          <div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Active managers and managers at 3 or more moments, weeks 1 to 5">
            ${[0, 12, 24].map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${P.l - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('')}
            ${bars}
            <line x1="${P.l}" x2="${W - P.r}" y1="${y(total * target)}" y2="${y(total * target)}" stroke="var(--good)" stroke-dasharray="4 4"/>
            <text x="${W - P.r + 6}" y="${y(total * target) + 4}" style="fill:var(--good)">target</text></svg></div>
        </section>
        <section class="panel" aria-labelledby="h-mix"><h2 id="h-mix">Where in the stack, this week</h2>
          ${[...TIERS].reverse().map((t) => `<div class="mixrow t-${t.id}"><span>${esc(t.name)} <span class="meta">${t.systems.map((x) => x.code).join('\u00b7')}</span></span><span class="bar"><span style="width:${(mix[t.id] / 0.38) * 100}%"></span></span><span class="v">${pct(mix[t.id])}</span></div>`).join('')}
          <p style="margin:0;font-size:12px;color:var(--muted)">Share of moments across all managers. Moments feed one of ten systems underneath (S0 to S9).</p>
        </section>
      </div>
      ${cohortPanels()}
      <section class="panel" aria-labelledby="h-never"><h2 id="h-never">What this view never shows</h2><ul class="never"><li>Any individual manager’s activity, ratings or notes</li><li>Any individual manager’s self-ratings</li><li>Meeting titles, descriptions or who attended</li><li>Breakdowns for groups smaller than 5 managers</li></ul></section>`;
  }

  // ------------------------------------------------------------ navigation
  function openEvent(id, { scrollTo } = {}) {
    S.view = 'manager';
    S.selected = id;
    S.stack = [{ card: 'home' }, { card: 'event', id }];
    renderGrid(); renderPopover(); renderPanel(); renderView();
    const target = scrollTo ? $(scrollTo) : $('#addon');
    requestAnimationFrame(() => {
      const ev = $(`[data-event="${id}"]`);
      if (ev && !isPhone()) ev.scrollIntoView({ block: 'nearest' });
      target?.scrollIntoView({ block: scrollTo ? 'center' : 'start' });
      if (scrollTo) flash(target);
    });
  }
  function push(card) { S.stack.push({ card }); renderPanel(); if (isPhone()) $('#addon').scrollIntoView({ block: 'start' }); }
  function flash(el) { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  const goCard = (card, sel) => { S.view = 'manager'; S.selected = null; S.stack = card === 'home' ? [{ card: 'home' }] : [{ card: 'home' }, { card }]; renderAll(); requestAnimationFrame(() => { const el = $(sel); el?.scrollIntoView({ block: 'nearest' }); flash(el); }); };

  const STEPS = [
    { t: 'Calendar in', d: 'LeadOS sits in the calendar\u2019s side panel. Today\u2019s moments span all five pillars; lunch and the vendor demo are left alone.', go: () => goCard('home', '#addon') },
    { t: 'Prep before the moment', d: 'Marcus at 12:00 is up next. Three questions, no script, picking up Monday\u2019s note.', go: () => openEvent('marcus', { scrollTo: '#prep' }) },
    { t: 'Capture in one tap', d: 'The Q4 goals kick-off just ended. One tap if it went well; \u201cwhat next\u201d only if it didn\u2019t.', go: () => openEvent('kickoff', { scrollTo: '#capture' }) },
    { t: 'Friday look-back', d: 'The week\u2019s captures become up to three questions. Rate each pillar, name a win, pick one thing to try.', go: () => goCard('lookback', '#reflect') },
    { t: 'Your pillars', d: 'Five pillars, each enabling the next. The ten systems stay underneath.', go: () => goCard('pillars', '#pillar-hold-standard') },
    { t: 'What HR sees', d: 'Usage against the pilot target. Never an individual\u2019s notes.', go: () => { S.view = 'hr'; renderView(); window.scrollTo({ top: 0 }); } },
  ];
  $('#steps').innerHTML = STEPS.map((s, i) => `<li><button type="button" data-step="${i}"><b>${s.t}</b><span>${s.d}</span></button></li>`).join('');
  function toggleScript(open) {
    const el = $('#script');
    el.hidden = !open;
    $('#script-btn').setAttribute('aria-expanded', String(open));
    if (open) el.querySelector('button[data-step]')?.focus();
  }

  // ------------------------------------------------------------ events
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) {
      if (S.selected && !ev.target.closest('.popover, .addon')) { S.selected = null; renderGrid(); renderPopover(); }
      return;
    }
    const d = b.dataset;
    if (d.view) { S.view = d.view; renderView(); }
    else if (d.event) openEvent(d.event);
    else if (d.open) openEvent(d.open);
    else if ('closePop' in d) { S.selected = null; renderGrid(); renderPopover(); }
    else if ('back' in d) { S.stack.pop(); if (top().card !== 'event') { S.selected = null; renderGrid(); renderPopover(); } renderPanel(); }
    else if (d.push) push(d.push);
    else if (d.cap) { const c = (S.captures[d.cap] ??= {}); c[d.f] = d.v; if (d.f === 'rating' && !L.needsNextStep(d.v)) delete c.next; renderPanel(); }
    else if (d.opennote) { S.noteOpen[d.opennote] = true; renderPanel(); $(`#note-${d.opennote}`)?.focus(); }
    else if (d.energy) { S.energy = d.energy; renderPanel(); }
    else if (d.ask) askPrep(byId[d.ask]);
    else if ('reflect' in d) askReflect();
        else if (d.step) { toggleScript(false); STEPS[d.step].go(); }
    else if ('closeScript' in d) toggleScript(false);
    else if (b.id === 'script-btn') toggleScript($('#script').hidden);
    else if (b.id === 'today-btn') { $('#grid-scroll').scrollTop = 0; }
    else if (b.id === 'reset') { S = fresh(); Object.keys(ai).forEach((k) => delete ai[k]); aiReflect = null; try { localStorage.removeItem(KEY); } catch {} renderAll(); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape') return;
    if (!$('#script').hidden) toggleScript(false);
    else if (S.selected) { S.selected = null; renderGrid(); renderPopover(); }
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.note) { (S.captures[t.dataset.note] ??= {}).note = t.value; persist(); }
    else if (t.id === 'lb-win') { S.lookback.win = t.value; persist(); }
    else if (t.id === 'lb-try') { S.lookback.tryNext = t.value; persist(); }
    else if (t.type === 'radio' && t.closest('#lookback-form')) { S.lookback.scores[t.name] = Number(t.value); persist(); }
  });
  document.addEventListener('submit', (ev) => {
    if (ev.target.id !== 'lookback-form') return;
    ev.preventDefault();
    S.lookback.saved = true;
    renderPanel();
  });
  let lastPhone = isPhone();
  addEventListener('resize', () => { if (isPhone() !== lastPhone) { lastPhone = isPhone(); renderGrid(); } renderPopover(); });

  renderAll();
  // Start the grid at 08:00 with the current time in view.
  $('#grid-scroll').scrollTop = 0;
})();
</script>
