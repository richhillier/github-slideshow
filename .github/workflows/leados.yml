name: LeadOS tests

on:
  push:
    paths: ['leados/**', '.github/workflows/leados.yml']
  pull_request:
    paths: ['leados/**', '.github/workflows/leados.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leados
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leados/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop and mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: leados/playwright-report
